name: Build Universal Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Create Release Keystore
        run: |
          keytool -genkeypair \
            -keystore release.keystore \
            -alias noavaran \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass noavaran123 \
            -keypass noavaran123 \
            -dname "CN=Noavaran, OU=Development, O=Noavaran, L=Darab, ST=Fars, C=IR"

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Align and Sign APK
        run: |
          BUILD_TOOLS=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias noavaran \
            --ks-pass pass:noavaran123 \
            --key-pass pass:noavaran123 \
            --out noavaran-game-universal.apk \
            app-release-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose noavaran-game-universal.apk

      - name: Upload Universal Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: noavaran-game-universal-apk
          path: noavaran-game-universal.apk
